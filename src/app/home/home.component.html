<div>
  <ngb-carousel *ngIf="popularProducts !== undefined">
    <ng-template ngbSlide *ngFor="let product of popularProducts">
      <div class="picsum-img-wrapper">
        <img [src]="product.imageurl" [alt]="product.imageurl" />
      </div>
      <div class="carousel-caption">
        <h3>{{ product.name }}</h3>
        <p>
          {{ product.description }}
          {{ product.color }}
        </p>
      </div>
    </ng-template>
  </ngb-carousel>
  <div class="product-list-wrapper">
    <h1>Trendy Products</h1>
  <div class="row">
  <div class="col-sm-3" *ngFor="let item of trendyProducts">
    <div class="product-item">
      <img src="{{item.imageurl}}" alt="">
    <div class="product-details">
      <h6 class="name-head">{{item.name}}</h6>
      <div class="product-price">
        <h6>Price:{{item.price}}</h6>
      </div>
      <div class="product-color">
        <h6>Color:{{item.color}}</h6>
      </div>
    </div>
    <div class="product-footer">
      <a routerLink="/details/{{item.id}}">View Details</a>
      <a href="">Add to Cart</a>

    </div>
    </div>
  </div>


</div>
</div>
