<p>header works!</p>

<nav class="nav">
    <h1>E-Comm</h1>
    <div class="nav-search" *ngIf="menuType=='seller'">
        <input type="search" placeholder="search for products" name="searchProduct" (keyup)="searchProducts($event)" #searchProduct/>
        <button (click)="searchProductSubmit(searchProduct.value)"> Search</button>
        <ul class="search-products">
            <li *ngFor="let data of searchedResult"><a>{{data.name}}</a></li>
        </ul>
    </div>
    <div [ngSwitch]="menuType">
   <ul *ngSwitchCase="'default'" class="navigation-links">
        <li><a routerLink="/home">Home</a></li>
        <li><a routerLink="/seller-auth">Seller</a></li>
        <li><a routerLink="/user-auth">Login</a></li>
        <li><a href="#">Cart (0)</a></li>
    </ul>
    <ul *ngSwitchCase="'seller'">
        <li><a routerLink="/seller-add-product">add product</a></li>
        <li><a routerLink="/seller-auth">list</a></li>
        <li><a (click)="Logout()">Logout</a></li>
        <li><a href="#">{{sellerName | titlecase}}</a></li>
    </ul>
      <ul *ngSwitchCase="'user'" class="navigation-links">
        <li><a routerLink="/home">Home</a></li>
        <li><a (click)="Logout()">Logout</a></li>
        <li><a routerLink="/user-auth">{{userName | titlecase}}</a></li>
        <li><a href="#">Cart (0)</a></li>
    </ul>
    </div>
 
</nav>
