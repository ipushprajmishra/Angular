<p>user-auth works!</p>

<div class="user-auth user-signup">
  <h1>User Signup</h1>

  <form
    #userSignup="ngForm"
    (ngSubmit)="Signup(userSignup.value)"
    class="common-form"
  >
    <input
      class="form-input"
      type="text"
      placeholder="Enter username"
      name="name"
      ngModel
    />

    <input
      class="form-input"
      type="text"
      placeholder="Enter email"
      name="email"
      ngModel
    />

    <input
      class="form-input"
      type="password"
      placeholder="Enter password"
      name="password"
      ngModel
    />
    <input type="submit" value="Signup" class="form-button" />
  </form>
</div>


<div class="user-auth user-login">
  <h1>User login</h1>

  <form
    #userLogin="ngForm"
    (ngSubmit)="Login(userLogin.value)"
    class="common-form"
  >

    <input
      class="form-input"
      type="text"
      placeholder="Enter email"
      name="email"
      ngModel
    />

    <input
      class="form-input"
      type="password"
      placeholder="Enter password"
      name="password"
      ngModel
    />
    <input type="submit" value="Login" class="form-button" />
  </form>
</div>
